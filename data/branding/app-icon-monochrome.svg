<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- IriFit App-Icon „I1 · Der Ring“ (Entscheidung Sascha 08.08.)
       Produkt-DNA: der „übrig“-Ring aus der Tagesansicht als Marke,
       auf dem Pastell-Wallpaper der App, mit zwei AI-Sternchen in der Mitte
       (verweist auf den Foto-Scan). Farben 1:1 aus src/theme/index.ts. -->
  <defs>
    <!-- Wallpaper: heller Grundton + die drei Farbflecken der App -->
    <linearGradient id="base" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF3F2"/>
      <stop offset="100%" stop-color="#F4ECEE"/>
    </linearGradient>
    <radialGradient id="rose" cx="18%" cy="8%" r="62%">
      <stop offset="0%" stop-color="#F4BBCD" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F4BBCD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lilac" cx="88%" cy="22%" r="60%">
      <stop offset="0%" stop-color="#D6C6E8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#D6C6E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="peach" cx="70%" cy="88%" r="62%">
      <stop offset="0%" stop-color="#FAD6C4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FAD6C4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mauve" cx="12%" cy="72%" r="55%">
      <stop offset="0%" stop-color="#ECD0DE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ECD0DE" stop-opacity="0"/>
    </radialGradient>

    <!-- Ring-Verlauf wie CalorieRing: tint → tintDeep -->
    <linearGradient id="ring" x1="200" y1="200" x2="824" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E87F9C"/>
      <stop offset="100%" stop-color="#D25578"/>
    </linearGradient>

    <!-- weicher Schatten unter dem Ring, damit er auf dem Pastell trägt -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#D25578" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- FOREGROUND: nur Motiv, Safe Zone -->

  <g transform="translate(512,512) scale(0.68) translate(-512,-512)"><g >
    <!-- Ring-Spur (der ungefüllte Rest, wie im Kalorienring) -->
    <circle cx="512" cy="512" r="270" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="74"/>
    <!-- Gefüllter Bogen: ~78 %, oben offen, runde Enden — Startpunkt oben Mitte -->
    <circle cx="512" cy="512" r="270" fill="none" stroke="#000000" stroke-width="74"
            stroke-linecap="round" stroke-dasharray="1696.5" stroke-dashoffset="373"
            transform="rotate(-90 512 512)"/>
  </g>

  <!-- Zwei AI-Sternchen in der Mitte: großer Vierstrahler + kleiner Begleiter.
       Konkave Seiten über Quadratic-Kurven zum Zentrum = klassisches Sparkle. -->
  </g>
  <g transform="translate(512,512) scale(0.68) translate(-512,-512)"><g transform="translate(0,-26)">
    <path fill="#000000" d="M512 386
             Q528 486 578 502
             Q528 518 512 618
             Q496 518 446 502
             Q496 486 512 386 Z"/>
    <path fill="#000000" opacity="0.92" d="M606 556
             Q615 606 640 615
             Q615 624 606 674
             Q597 624 572 615
             Q597 606 606 556 Z"/>
  </g></g>
</svg>
